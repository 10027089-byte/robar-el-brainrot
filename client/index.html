<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8bdcff" />
    <meta
      name="description"
      content="Compra Brainrots en la pasarela, instala criaturas en tu base y recoge sus ganancias."
    />
    <title>Robar el Brainrot</title>
    <script src="https://sdk.bloxity.io/v1/legion-sdk.min.js"></script>
  </head>
  <body>
    <main class="game-shell">
      <canvas id="game-canvas" aria-label="Mundo 3D de Robar el Brainrot"></canvas>

      <section class="hud" aria-label="Dinero y ganancias">
        <span id="player-identity" class="player-identity" aria-label="Jugador"></span>
        <div class="money-readout">
          <div class="money-stat">
            <span class="stat-label">DINERO</span>
            <strong id="money-value">$250</strong>
          </div>
          <span class="hud-divider" aria-hidden="true"></span>
          <div class="money-stat income-stat">
            <span class="stat-label">GANANCIAS</span>
            <strong id="income-value">$0 <small>/s</small></strong>
          </div>
        </div>
        <button id="shop-toggle" class="shop-toggle" type="button" aria-expanded="false" aria-controls="shop-panel">
          <span aria-hidden="true">＋</span> Tienda
        </button>
      </section>

      <div class="world-label label-base" aria-hidden="true"><span>⌂</span> TU BASE</div>
      <div class="world-label label-vault" aria-hidden="true"><span>★</span> PASARELA CENTRAL</div>

      <section id="shop-panel" class="shop-panel" aria-label="Tienda" aria-hidden="true">
        <div class="shop-heading">
          <div>
            <span class="panel-eyebrow">MEJORAS</span>
            <strong>Tienda</strong>
          </div>
          <span class="shop-currency">✦ <span id="shop-money">$0</span></span>
        </div>
        <div class="upgrade-list">
          <button class="upgrade-card" data-upgrade="speed" type="button">
            <span class="upgrade-icon speed-icon">↗</span>
            <span class="upgrade-copy"><strong>Impulso</strong><small>Más velocidad</small></span>
            <span class="upgrade-cost">$35</span>
          </button>
          <button class="upgrade-card" data-upgrade="jump" type="button">
            <span class="upgrade-icon jump-icon">↑</span>
            <span class="upgrade-copy"><strong>Salto lunar</strong><small>Más altura</small></span>
            <span class="upgrade-cost">$45</span>
          </button>
          <button class="upgrade-card" data-upgrade="capacity" type="button">
            <span class="upgrade-icon bag-icon">◇</span>
            <span class="upgrade-copy"><strong>Mochila XL</strong><small>+1 espacio</small></span>
            <span class="upgrade-cost">$60</span>
          </button>
        </div>
      </section>

      <div class="interaction-prompt" id="interaction-prompt" role="status">
        <kbd>E</kbd><span>Interactuar</span>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>

      <footer class="controls-hint">
        <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> MOVER</span>
        <span><kbd>ESPACIO</kbd> SALTAR</span>
        <span><kbd>E</kbd> COMPRAR / RECOGER</span>
        <span>ARRASTRA PARA MIRAR</span>
      </footer>

      <div class="mobile-controls" aria-label="Controles táctiles">
        <div class="dpad">
          <button data-key="KeyW" class="dpad-up" aria-label="Avanzar">▲</button>
          <button data-key="KeyA" class="dpad-left" aria-label="Mover a la izquierda">◀</button>
          <button data-key="KeyS" class="dpad-down" aria-label="Retroceder">▼</button>
          <button data-key="KeyD" class="dpad-right" aria-label="Mover a la derecha">▶</button>
        </div>
        <div class="mobile-actions">
          <button id="mobile-interact" class="mobile-action interact-action" aria-label="Interactuar">E</button>
          <button id="mobile-jump" class="mobile-action jump-action" aria-label="Saltar">↑</button>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
